<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>twblock fixture</title>
<style>
  body { margin: 0; font-family: sans-serif; width: 600px; }
  .row { display: flex; flex-direction: row; align-items: center; }
  .col { display: flex; flex-direction: column; }
  .ml12 { margin-left: 12px; }
  .wide { width: 520px; }
  /* 実物の article[data-testid=tweet] は flex の行。block にすると
     「バーが文字幅に縮む」類の不具合が再現しない */
  article { display: flex; flex-direction: row; border-bottom: 1px solid #ccc; padding: 8px; width: 560px; }
  article > div { flex: 1 1 auto; min-width: 0; }
  .actionbar { display: flex; flex-direction: row; width: 420px; justify-content: space-between; }
</style>
</head>
<body>
<div id="layers"></div>
<nav><a data-testid="AppTabBar_Profile_Link" role="link" href="/me_myself">Profile</a></nav>
<div id="root"></div>

<script>
// X の実DOMから採寸した構造を再現する。
//   UserCell:  cell > rowOuter(518px flex row) > [nameCol, rowInner(209px flex row) > followChild(ml:12px) > button]
//   nested=false のときは followChild を rowOuter の直下に置く（X が再レンダリングで実際に見せた形）
window.buildUserCell = function (screenName, opts) {
  opts = opts || {};
  const cell = document.createElement('div');
  cell.setAttribute('data-testid', 'UserCell');

  const rowOuter = document.createElement('div');
  rowOuter.className = 'row wide';
  // Verified Followers / Following の行は space-between で、
  // Followボタンは外側の行の直下にいる
  if (opts.spaceBetween) {
    rowOuter.style.justifyContent = 'space-between';
    rowOuter.style.alignItems = 'center';
  }

  const nameCol = document.createElement('div');
  nameCol.className = 'col';
  const link = document.createElement('a');
  link.setAttribute('role', 'link');
  link.setAttribute('href', '/' + screenName);
  link.textContent = screenName;
  const handle = document.createElement('span');
  handle.textContent = '@' + screenName;
  nameCol.appendChild(link);
  nameCol.appendChild(handle);
  rowOuter.appendChild(nameCol);

  const followChild = document.createElement('div');
  followChild.className = 'col ml12';
  const btn = document.createElement('button');
  btn.setAttribute('data-testid', (opts.testid || '1234-follow'));
  btn.textContent = opts.label || 'Follow';
  followChild.appendChild(btn);

  if (opts.nested === false || opts.spaceBetween) {
    rowOuter.appendChild(followChild);
  } else {
    const rowInner = document.createElement('div');
    rowInner.className = 'row';
    rowInner.appendChild(followChild);
    const caret = document.createElement('div');
    caret.className = 'row';
    caret.textContent = '⋯';
    rowInner.appendChild(caret);
    rowOuter.appendChild(rowInner);
  }

  cell.appendChild(rowOuter);
  return cell;
};

window.buildTweet = function (screenName, opts) {
  opts = opts || {};
  const article = document.createElement('article');
  article.setAttribute('data-testid', 'tweet');

  const inner = document.createElement('div');
  article.appendChild(inner);

  if (opts.retweeter) {
    const scLink = document.createElement('a');
    scLink.setAttribute('href', '/' + opts.retweeter);
    const scWrap = document.createElement('div');
    scWrap.className = 'col';
    const sc = document.createElement('span');
    sc.setAttribute('data-testid', 'socialContext');
    sc.textContent = opts.retweeter + ' reposted';
    scLink.appendChild(sc);
    scWrap.appendChild(scLink);
    inner.appendChild(scWrap);
  }

  const userName = document.createElement('div');
  userName.setAttribute('data-testid', 'User-Name');
  const link = document.createElement('a');
  link.setAttribute('role', 'link');
  link.setAttribute('href', '/' + screenName);
  link.textContent = screenName;
  userName.appendChild(link);
  inner.appendChild(userName);

  const text = document.createElement('div');
  text.textContent = 'tweet body for ' + screenName;
  inner.appendChild(text);

  const bar = document.createElement('div');
  bar.className = 'actionbar';
  for (const name of ['reply', 'retweet', 'like', 'bookmark']) {
    const slot = document.createElement('div');
    slot.className = 'row';
    slot.textContent = name;
    bar.appendChild(slot);
  }
  const grokSlot = document.createElement('div');
  grokSlot.className = 'row';
  const grok = document.createElement('button');
  grok.setAttribute('aria-label', 'Grok actions');
  grok.textContent = 'grok';
  grokSlot.appendChild(grok);
  bar.appendChild(grokSlot);

  const caretSlot = document.createElement('div');
  caretSlot.className = 'row';
  const caret = document.createElement('button');
  caret.setAttribute('data-testid', 'caret');
  caret.textContent = '⋯';
  caretSlot.appendChild(caret);
  bar.appendChild(caretSlot);

  inner.appendChild(bar);
  return article;
};

window.buildProfile = function (screenName, opts) {
  opts = opts || {};
  const wrap = document.createElement('div');
  wrap.setAttribute('data-testid', 'primaryColumn');
  const header = document.createElement('div');
  header.className = 'col';

  const actionRow = document.createElement('div');
  actionRow.className = 'row';
  actionRow.setAttribute('data-twblock-action-row', '1');
  const more = document.createElement('button');
  more.setAttribute('data-testid', 'userActions');
  more.textContent = '⋯';
  actionRow.appendChild(more);

  // DM / 通知 / サブスクなど、X 側のボタンを増やす
  for (let i = 0; i < (opts.extras || 0); i++) {
    const extra = document.createElement('button');
    extra.setAttribute('data-testid', 'profileExtra' + i);
    extra.textContent = 'x';
    actionRow.appendChild(extra);
  }

  const placement = document.createElement('div');
  placement.className = 'col';
  placement.setAttribute('data-testid', 'placementTracking');
  const btn = document.createElement('button');
  btn.setAttribute('data-testid', '9999-follow');
  btn.textContent = 'Follow';
  placement.appendChild(btn);
  actionRow.appendChild(placement);
  header.appendChild(actionRow);

  const userName = document.createElement('div');
  userName.setAttribute('data-testid', 'UserName');
  const link = document.createElement('a');
  link.setAttribute('role', 'link');
  link.setAttribute('href', '/' + screenName);
  link.textContent = screenName;
  const handle = document.createElement('span');
  handle.textContent = '@' + screenName;
  userName.appendChild(link);
  userName.appendChild(handle);
  header.appendChild(userName);

  wrap.appendChild(header);
  return wrap;
};

// X がプロフィールの操作行に後からボタンを足す（サブスク等）のを再現する
window.addLateProfileButton = function () {
  const row = document.querySelector('[data-twblock-action-row]');
  const placement = row.querySelector('[data-testid="placementTracking"]');
  const late = document.createElement('div');
  late.className = 'col';
  late.setAttribute('data-testid', 'lateGiftButton');
  const b = document.createElement('button');
  b.textContent = 'gift';
  late.appendChild(b);
  // React は自分の次の兄弟の前に挿す。こちらのコンテナはその間にいる
  row.insertBefore(late, placement);
  return true;
};

window.reset = function () {
  document.getElementById('root').textContent = '';
};
</script>
</body>
</html>
